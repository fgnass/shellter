name: Shellter
options:
  bundleIdPrefix: com.fgnass
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # GhosttyKit and zmx are built for Apple silicon only.
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual

targets:
  Shellter:
    type: application
    scheme:
      testTargets: [ShellterTests]
    platform: macOS
    sources:
      - path: Sources/Shellter
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/terminfo
        type: folder
        buildPhase: resources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/AgentIcons
        type: folder
        buildPhase: resources
      - path: Resources/defaults.config
        buildPhase: resources
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: vendor/bin/zmx
        attributes: [CodeSignOnCopy]
        buildPhase:
          copyFiles:
            destination: executables
    dependencies:
      - framework: vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fgnass.shellter
        PRODUCT_NAME: Shellter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Shellter/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shellter/Shellter-Bridging-Header.h
        OTHER_LDFLAGS: ["-lstdc++"]
        ENABLE_APP_SANDBOX: NO

  # Logic tests. Not hosted in the app: a test host would start a second Shellter with
  # the real tabs and zmx sessions. The tested files are compiled into the bundle.
  ShellterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ShellterTests
      - path: Sources/Shellter/Model/Agent.swift
      - path: Sources/Shellter/Model/AgentSession.swift
      - path: Sources/Shellter/Model/ProcessInspector.swift
      - path: Sources/Shellter/Model/LinkedWindows.swift
      - path: Sources/Shellter/Model/PortClassifier.swift
      - path: Sources/Shellter/Model/Shell.swift
      - path: Sources/Shellter/Model/AgentText.swift
      - path: Sources/Shellter/Model/Reorder.swift
      - path: Sources/Shellter/Model/IconResolver.swift
      - path: Sources/Shellter/UI/SidebarSettings.swift
      - path: Sources/Shellter/UI/ProjectColors.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fgnass.shellter.tests
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shellter/Shellter-Bridging-Header.h
